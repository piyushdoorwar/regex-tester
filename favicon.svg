<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0714" />
      <stop offset="100%" stop-color="#1c0f2f" />
    </linearGradient>
    <radialGradient id="glowYellow" cx="28%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="72%" cy="72%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect width="64" height="64" rx="14" fill="url(#glowYellow)" />
  <rect width="64" height="64" rx="14" fill="url(#glowPurple)" />

  <g font-family="'Segoe UI', 'Arial', sans-serif" font-weight="700" font-style="italic" text-anchor="middle">
    <text x="32" y="38" font-size="14" textLength="52" lengthAdjust="spacingAndGlyphs" fill="url(#textGradient)" opacity="0.6" filter="url(#neon)">/(reg)ex/</text>
    <text x="32" y="38" font-size="14" textLength="52" lengthAdjust="spacingAndGlyphs" fill="url(#textGradient)">/(reg)ex/</text>
  </g>
</svg>
